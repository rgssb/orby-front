<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Editar Usuário</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=22">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=11">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=9">
    <link rel="stylesheet" href="/assets/css/usuarios.css?v=18">
    <script src="/assets/js/tema.js?v=3"></script>
</head>
<body>
    {{template "cabecalho"}}

    <main class="container-fluid users-page edit-profile-page">
        <section class="users-column" aria-labelledby="edit-profile-title">
            <article class="composer-card edit-profile-card">
                <header class="composer-header">
                    <span class="composer-icon" aria-hidden="true"><i class="fa-solid fa-user-pen"></i></span>
                    <div>
                        <h1 id="edit-profile-title">Editar usuário</h1>
                        <p>Atualize suas informações de perfil.</p>
                    </div>
                </header>
                <form class="edit-profile-form" id="editar-usuario">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" class="form-control" id="nome" name="nome" placeholder="Digite seu nome" value="{{.Nome}}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Digite seu email" value="{{.Email}}" required>
                    </div>
                    <div class="form-group">
                        <label for="nick">Nick</label>
                        <input type="text" class="form-control" id="nick" name="nick" placeholder="Digite seu nick" value="{{.Nick}}" required>
                    </div>
                    <div class="edit-profile-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Salvar alterações</button>
                    </div>
                </form>
            </article>
        </section>
    </main>

    {{template "rodape"}}
    {{template "scripts"}}
    <script src="/assets/js/usuario.js?v=4"></script>
</body>
</html>
