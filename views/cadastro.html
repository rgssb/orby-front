<html lang="en">
<head> 
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cadastro de Usuário</title>
        <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
        <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
        <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
        <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
        <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">

        <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
        <link rel="stylesheet" type="text/css" href="/assets/css/login.css?v=4">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/themes.css?v=7">
    <script src="/assets/js/tema.js?v=3"></script>

</head>
 <body>
 <div class="login-container">
        <div>
            <form class="Orby-form needs-validation" id="form-cadastro" novalidate>
                <div class="orby-mascot" id="orbyMascot" data-state="default" aria-hidden="true">
                    <div class="orby-glow"></div>
                    <div class="orby-inner">
                        <svg viewBox="0 0 120 120" width="72" height="72">
                            <defs>
                                <radialGradient id="orby-body-gradient" cx="34%" cy="28%" r="76%">
                                    <stop offset="0%" stop-color="#1E3A8A"></stop>
                                    <stop offset="48%" stop-color="#0F172A"></stop>
                                    <stop offset="100%" stop-color="#020617"></stop>
                                </radialGradient>
                                <linearGradient id="orby-ring-gradient" x1="8" y1="60" x2="112" y2="60" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#0EA5E9"></stop>
                                    <stop offset="20%" stop-color="#06B6D4"></stop>
                                    <stop offset="35%" stop-color="#00D9FF"></stop>
                                    <stop offset="50%" stop-color="#1E40AF"></stop>
                                    <stop offset="70%" stop-color="#0EA5E9"></stop>
                                    <stop offset="85%" stop-color="#38BDF8"></stop>
                                    <stop offset="100%" stop-color="#06B6D4"></stop>
                                </linearGradient>
                                <linearGradient id="orby-orbit-gradient" x1="60" y1="8" x2="60" y2="112" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#0EA5E9"></stop>
                                    <stop offset="15%" stop-color="#00D9FF"></stop>
                                    <stop offset="30%" stop-color="#06B6D4"></stop>
                                    <stop offset="50%" stop-color="#0284C7"></stop>
                                    <stop offset="70%" stop-color="#38BDF8"></stop>
                                    <stop offset="85%" stop-color="#0EA5E9"></stop>
                                    <stop offset="100%" stop-color="#06B6D4"></stop>
                                </linearGradient>
                                <filter id="orby-energy-texture" x="-20%" y="-20%" width="140%" height="140%">
                                    <feTurbulence type="fractalNoise" baseFrequency="0.12 0.22" numOctaves="4" seed="42" result="noise"></feTurbulence>
                                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
                                </filter>
                            </defs>
                            <path class="orby-ring orby-ring-depth-outer orby-ring-back" d="M2 60 A58 17 0 0 1 118 60"></path>
                            <path class="orby-ring orby-ring-back" d="M8 60 A52 15 0 0 1 112 60"></path>
                            <path class="orby-ring orby-ring-orbit orby-ring-orbit-back" d="M60 8 A17 52 0 0 1 60 112"></path>
                            <path class="orby-ring orby-ring-depth-inner orby-ring-back" d="M13 60 A47 14 0 0 1 107 60"></path>
                            <path class="orby-ring orby-ring-inner" d="M18 60 A42 12 0 0 1 102 60"></path>
                            <path class="orby-energy-wisp" d="M21 43 Q34 20 51 16"></path>
                            <path class="orby-energy-wisp orby-energy-wisp-alt" d="M77 102 Q96 91 102 72"></path>
                            <circle class="orby-body" fill="url(#orby-body-gradient)" cx="60" cy="60" r="33"></circle>
                            <circle class="orby-core-orbit" cx="60" cy="60" r="28"></circle>
                            <path class="orby-body-shine" d="M38 42 C44 29 57 24 69 28"></path>

                            <g class="orby-eye" id="orbyEyeL">
                                <circle class="orby-sclera" cx="47" cy="60" r="9"></circle>
                                <circle class="orby-pupil" cx="47" cy="60" r="6" fill="#60A5FA"></circle>
                                <circle class="orby-glint" cx="45" cy="57" r="1.5" fill="#FFFFFF" opacity="0.8"></circle>
                                <path class="orby-lid orby-lid-happy" d="M39 61 Q47 55 55 61"></path>
                                <path class="orby-lid orby-lid-closed" d="M39 60 Q47 65 55 60"></path>
                                <path class="orby-lid orby-lid-worried" d="M39 57 Q47 62 55 58"></path>
                            </g>
                            <g class="orby-eye" id="orbyEyeR">
                                <circle class="orby-sclera" cx="73" cy="60" r="9"></circle>
                                <circle class="orby-pupil" cx="73" cy="60" r="6" fill="#60A5FA"></circle>
                                <circle class="orby-glint" cx="71" cy="57" r="1.5" fill="#FFFFFF" opacity="0.8"></circle>
                                <path class="orby-lid orby-lid-happy" d="M65 61 Q73 55 81 61"></path>
                                <path class="orby-lid orby-lid-closed" d="M65 60 Q73 65 81 60"></path>
                                <path class="orby-lid orby-lid-worried" d="M65 58 Q73 62 81 57"></path>
                            </g>

                            <path class="orby-mouth orby-mouth-worried" d="M50 79 Q60 74 70 79"></path>
                            <path class="orby-mouth orby-mouth-smile" d="M51 77 Q60 83 69 77"></path>

                            <path class="orby-ring orby-ring-inner" d="M18 60 A42 12 0 0 0 102 60"></path>
                            <path class="orby-ring orby-ring-depth-inner orby-ring-front" d="M13 60 A47 14 0 0 0 107 60"></path>
                            <path class="orby-ring orby-ring-orbit orby-ring-orbit-front" d="M60 8 A17 52 0 0 0 60 112"></path>
                            <path class="orby-ring orby-ring-front" d="M8 60 A52 15 0 0 0 112 60"></path>
                            <path class="orby-ring orby-ring-depth-outer orby-ring-front" d="M2 60 A58 17 0 0 0 118 60"></path>
                            <circle class="orby-energy-node" cx="20" cy="67" r="1.8"></circle>
                            <circle class="orby-energy-node orby-energy-node-alt" cx="103" cy="56" r="1.8"></circle>
                        </svg>
                    </div>
                    <div class="orby-sparkles">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
                <span>Crie sua conta agora!</span>
                <div class="form-group">
                    <label class="sr-only" for="nome">Nome</label>
                    <input class="form-control" type="text" name="name" id="nome" placeholder="Digite o seu nome" autocomplete="name" aria-describedby="nome-feedback" required>
                    <div class="invalid-feedback" id="nome-feedback">Digite seu nome.</div>
                </div>
                <div class="form-group">
                    <label class="sr-only" for="email">E-mail</label>
                    <input class="form-control" type="email" name="email" id="email" placeholder="Digite o seu email" autocomplete="email" aria-describedby="email-feedback" required>
                    <div class="invalid-feedback" id="email-feedback">Digite um e-mail válido.</div>
                </div>
                <div class="form-group">
                    <label class="sr-only" for="nick">Nick</label>
                    <input class="form-control" type="text" name="nick" id="nick" placeholder="Digite o seu nick" autocomplete="nickname" aria-describedby="nick-feedback" required>
                    <div class="invalid-feedback" id="nick-feedback">Digite seu nick.</div>
                </div>
                <div class="form-group">
                    <label class="sr-only" for="senha">Senha</label>
                    <div class="input-group password-field">
                        <input class="form-control" type="password" name="senha" id="senha" placeholder="Digite a sua senha" autocomplete="new-password" aria-describedby="senha-feedback" required>
                        <button class="btn password-toggle" type="button" data-password-toggle aria-label="Mostrar senha" aria-pressed="false" aria-controls="senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="password-eye-open">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </g>
                                <g class="password-eye-closed">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
                                    <path d="m3 3 18 18"></path>
                                </g>
                            </svg>
                        </button>
                        <div class="invalid-feedback" id="senha-feedback">Digite sua senha.</div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="sr-only" for="confirmar-senha">Confirme a senha</label>
                    <div class="input-group password-field">
                        <input class="form-control" type="password" name="confirmar-senha" id="confirmar-senha" placeholder="Confirme a sua senha" autocomplete="new-password" aria-describedby="confirmar-senha-feedback" required>
                        <button class="btn password-toggle" type="button" data-password-toggle aria-label="Mostrar senha" aria-pressed="false" aria-controls="confirmar-senha">
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                <g class="password-eye-open">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </g>
                                <g class="password-eye-closed">
                                    <path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6S2 12 2 12Z"></path>
                                    <path d="m3 3 18 18"></path>
                                </g>
                            </svg>
                        </button>
                        <div class="invalid-feedback" id="confirmar-senha-feedback">Preencha a confirmação e confira se as senhas são iguais.</div>
                    </div>
                </div>
                <div class="alert form-message" id="form-message" role="alert" aria-live="polite" hidden></div>
                <a href="/login">Clique aqui para realizar o Login</a>
                <button type="submit" class="btn btn-primary btn-Orby">Cadastrar</button>
            </form>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/orby-mascot.js?v=3"></script>
    <script src="/assets/js/password-toggle.js"></script>
    <script src="/assets/js/jquery.js"></script> 
    <script src="/assets/js/cadastro.js?v=4"></script>
    </body>
</html>
