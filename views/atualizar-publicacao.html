<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Atualizar publicação</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=20">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=7">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=3">
    <script src="/assets/js/tema.js?v=3"></script>
</head>

</html>
<body>
        {{template "cabecalho"}}
    <div class="container-fluid">   
        <div class="container mt-4"> 
            <div class="col-12">
                <h3>Atualizar publicação</h3>
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título da publicação" value="{{.Titulo}}">
                </div>
                <div class="form-group">
                    <label for="conteudo">Conteúdo</label>
                    <textarea class="form-control" id="conteudo" name="conteudo" placeholder="Digite o conteúdo da publicação">{{.Conteudo}}</textarea>
                </div>
                <button id="atualizar" data-publicacao-id="{{.ID}}" type="submit" class="btn btn-primary mt-3">Atualizar</button>
            </div>
        </div>
    </div>
        
    {{template "rodape"}}
    {{template "scripts"}}
    <script src="/assets/js/publicacoes.js?v=9"></script>

</body>
