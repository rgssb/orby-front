<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Atualizar publicação</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=22">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=12">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=28">
    <script src="/assets/js/tema.js?v=3"></script>
</head>

<body>
        {{template "cabecalho"}}
    <main id="conteudo-principal" tabindex="-1" class="container-fluid home-page">
        <div class="row mt-4 home-layout home-layout--unico">
            <section class="compose-column" aria-labelledby="atualizar-title">
                <div class="composer-card">
                    <header class="composer-header">
                        <span class="composer-icon" aria-hidden="true"><i class="fa-solid fa-pen"></i></span>
                        <h1 id="atualizar-title">Atualizar publicação</h1>
                    </header>
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input type="text" class="form-control" id="titulo" name="titulo" placeholder="Digite o título da publicação" value="{{.Titulo}}">
                </div>
                <div class="form-group">
                    <label for="conteudo">Conteúdo</label>
                    <textarea class="form-control" id="conteudo" name="conteudo" placeholder="Digite o conteúdo da publicação">{{.Conteudo}}</textarea>
                </div>
                {{if .TemImagem}}
                <div class="form-group image-current">
                    <span class="d-block mb-1">Imagem atual</span>
                    <img class="post-image" src="/publicacoes/{{.ID}}/imagem" alt="Imagem atual da publicação">
                    <label class="image-remove"><input type="checkbox" id="remover-imagem-atual"> Remover imagem atual</label>
                </div>
                {{end}}
                {{template "campo-imagem"}}
                <div class="composer-actions">
                    <button id="atualizar" data-publicacao-id="{{.ID}}" type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i> Atualizar</button>
                </div>
                </div>
            </section>
        </div>
    </main>

        
    {{template "rodape"}}
    {{template "scripts"}}

</body>

</html>
