<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Início</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=13">
</head>
<body>


    {{template "cabecalho"}}

    <div class="container-fluid">
        <div class="row mt-4">
            <div class="col-xs-12 col-sm-12 col-md-5 col-lg-5 col-xl-5">
                <!-- Conteúdo da coluna esquerda -->
                <h3>Nova Publicação</h3>
                <fieldset>
                    <form id="nova-publicacao">
                        <div class="form-group">
                            <label for="titulo-publicacao">Título</label>
                            <input type="text" class="form-control" id="titulo-publicacao" name="titulo" required="required" placeholder="Coloque o título da publicação">
                        </div>
                        <div class="form-group">
                            <label for="conteudo-publicacao">Conteúdo</label>
                            <textarea class="form-control" id="conteudo-publicacao" name="conteudo" required="required" placeholder="Escreva o conteúdo da publicação"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i> Publicar</button>
                    </form>
                </fieldset>
            </div>
            <div class="col-xs-12 col-sm-12 col-md-7 col-lg-7 col-xl-7">
                <!-- Conteúdo da coluna direita -->
                 {{range .Publicacoes}}
                    {{if (eq .AutorID $.UsuarioID)}}
                    {{template "publicacao-com-permissao" .}}
                    {{else}}
                    {{template "publicacao-sem-permissao" .}}
                    {{end}}
                {{end}}
            </div>
        </div>
    </div>

{{template "rodape"}}

{{template "scripts" }}

    <script src="/assets/js/jquery.js"></script>
    <script src="/assets/js/publicacoes.js?v=5"></script>
</body>
</html>
