{{define "mascote"}}
<span class="orby-mascot {{.}}" data-state="default" aria-hidden="true">
    <span class="orby-glow"></span>
    <span class="orby-inner">
        <svg viewBox="0 0 120 120" width="72" height="72">
            <defs>
                <radialGradient id="orby-body-gradient" cx="34%" cy="28%" r="76%">
                    <stop offset="0%" stop-color="#1E3A8A"></stop>
                    <stop offset="48%" stop-color="#0F172A"></stop>
                    <stop offset="100%" stop-color="#020617"></stop>
                </radialGradient>
                <linearGradient id="orby-ring-gradient" x1="8" y1="60" x2="112" y2="60" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#0EA5E9"></stop>
                    <stop offset="20%" stop-color="#06B6D4"></stop>
                    <stop offset="35%" stop-color="#00D9FF"></stop>
                    <stop offset="50%" stop-color="#1E40AF"></stop>
                    <stop offset="70%" stop-color="#0EA5E9"></stop>
                    <stop offset="85%" stop-color="#38BDF8"></stop>
                    <stop offset="100%" stop-color="#06B6D4"></stop>
                </linearGradient>
                <linearGradient id="orby-orbit-gradient" x1="60" y1="8" x2="60" y2="112" gradientUnits="userSpaceOnUse">
                    <stop offset="0%" stop-color="#0EA5E9"></stop>
                    <stop offset="15%" stop-color="#00D9FF"></stop>
                    <stop offset="30%" stop-color="#06B6D4"></stop>
                    <stop offset="50%" stop-color="#0284C7"></stop>
                    <stop offset="70%" stop-color="#38BDF8"></stop>
                    <stop offset="85%" stop-color="#0EA5E9"></stop>
                    <stop offset="100%" stop-color="#06B6D4"></stop>
                </linearGradient>
            </defs>
            <path class="orby-ring orby-ring-depth-outer orby-ring-back" d="M2 60 A58 17 0 0 1 118 60"></path>
            <path class="orby-ring orby-ring-back" d="M8 60 A52 15 0 0 1 112 60"></path>
            <path class="orby-ring orby-ring-orbit orby-ring-orbit-back" d="M60 8 A17 52 0 0 1 60 112"></path>
            <path class="orby-ring orby-ring-depth-inner orby-ring-back" d="M13 60 A47 14 0 0 1 107 60"></path>
            <path class="orby-ring orby-ring-inner" d="M18 60 A42 12 0 0 1 102 60"></path>
            <path class="orby-energy-wisp" d="M21 43 Q34 20 51 16"></path>
            <path class="orby-energy-wisp orby-energy-wisp-alt" d="M77 102 Q96 91 102 72"></path>
            <circle class="orby-body" fill="url(#orby-body-gradient)" cx="60" cy="60" r="33"></circle>
            <circle class="orby-core-orbit" cx="60" cy="60" r="28"></circle>
            <path class="orby-body-shine" d="M38 42 C44 29 57 24 69 28"></path>

            <g class="orby-eye">
                <circle class="orby-sclera" cx="47" cy="60" r="9"></circle>
                <circle class="orby-pupil" cx="47" cy="60" r="6" fill="#60A5FA"></circle>
                <circle class="orby-glint" cx="45" cy="57" r="1.5" fill="#FFFFFF" opacity="0.8"></circle>
                <path class="orby-lid orby-lid-happy" d="M39 61 Q47 55 55 61"></path>
                <path class="orby-lid orby-lid-closed" d="M39 60 Q47 65 55 60"></path>
                <path class="orby-lid orby-lid-worried" d="M39 57 Q47 62 55 58"></path>
            </g>
            <g class="orby-eye">
                <circle class="orby-sclera" cx="73" cy="60" r="9"></circle>
                <circle class="orby-pupil" cx="73" cy="60" r="6" fill="#60A5FA"></circle>
                <circle class="orby-glint" cx="71" cy="57" r="1.5" fill="#FFFFFF" opacity="0.8"></circle>
                <path class="orby-lid orby-lid-happy" d="M65 61 Q73 55 81 61"></path>
                <path class="orby-lid orby-lid-closed" d="M65 60 Q73 65 81 60"></path>
                <path class="orby-lid orby-lid-worried" d="M65 58 Q73 62 81 57"></path>
            </g>

            <path class="orby-mouth orby-mouth-worried" d="M50 79 Q60 74 70 79"></path>
            <path class="orby-mouth orby-mouth-smile" d="M51 77 Q60 83 69 77"></path>

            <path class="orby-ring orby-ring-inner" d="M18 60 A42 12 0 0 0 102 60"></path>
            <path class="orby-ring orby-ring-depth-inner orby-ring-front" d="M13 60 A47 14 0 0 0 107 60"></path>
            <path class="orby-ring orby-ring-orbit orby-ring-orbit-front" d="M60 8 A17 52 0 0 0 60 112"></path>
            <path class="orby-ring orby-ring-front" d="M8 60 A52 15 0 0 0 112 60"></path>
            <path class="orby-ring orby-ring-depth-outer orby-ring-front" d="M2 60 A58 17 0 0 0 118 60"></path>
            <circle class="orby-energy-node" cx="20" cy="67" r="1.8"></circle>
            <circle class="orby-energy-node orby-energy-node-alt" cx="103" cy="56" r="1.8"></circle>
        </svg>
    </span>
    <span class="orby-sparkles">
        <span></span><span></span><span></span><span></span><span></span>
    </span>
</span>
{{end}}
