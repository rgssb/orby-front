{{define "scripts"}}
    <script src="/assets/js/jquery.js?v=3.7.1"></script>
    <script src="/assets/js/bootstrap.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/assets/js/orby-mascot.js?v=3"></script>
    <script src="/assets/js/ui.js?v=7"></script>
    <script src="/assets/js/publicacoes.js?v=17"></script>
    <script src="/assets/js/comentarios.js?v=5"></script>
    <script src="/assets/js/notificacoes.js?v=7"></script>
    <script src="/assets/js/mensagens-base.js?v=1"></script>
    <script src="/assets/js/grupos.js?v=2"></script>
    <script src="/assets/js/mensagens.js?v=7"></script>
    <script src="/assets/js/mencoes.js?v=1"></script>
    <script src="/assets/js/recursos.js?v=7"></script>
    <script src="https://kit.fontawesome.com/db88157b12.js" crossorigin="anonymous"></script>
    <script>
        const navbarToggle = document.querySelector(".navbar-toggler");
        const navbarMenu = document.getElementById("navbarTogglerDemo02");
        navbarToggle.addEventListener("click", () => {
            const expanded = navbarToggle.getAttribute("aria-expanded") === "true";
            navbarToggle.setAttribute("aria-expanded", String(!expanded));
            navbarMenu.classList.toggle("show", !expanded);
        });

        const searchToggle = document.querySelector(".navbar-search-toggle");
        const searchInput = document.getElementById("navbar-search-input");
        const searchForm = searchToggle.closest(".navbar-search");

        function setSearchOpen(open) {
            searchForm.classList.toggle("is-open", open);
            searchToggle.setAttribute("aria-expanded", String(open));
            searchToggle.setAttribute("aria-label", open ? "Fechar pesquisa" : "Abrir pesquisa");
            searchInput.setAttribute("aria-hidden", String(!open));
            searchInput.tabIndex = open ? 0 : -1;
            searchInput.disabled = !open;

            if (open) {
                requestAnimationFrame(() => searchInput.focus());
            }
        }

        // As abas de busca levam o termo já digitado de uma página para a outra
        const termoAtual = new URLSearchParams(window.location.search);
        const termoBusca = termoAtual.get("usuario") || termoAtual.get("q") || "";
        if (termoBusca) {
            document.querySelectorAll(".search-tab").forEach((aba) => {
                const publicacoes = aba.getAttribute("href").indexOf("publicacoes") !== -1;
                aba.href = (publicacoes ? "/buscar-publicacoes?q=" : "/buscar-usuarios?usuario=") + encodeURIComponent(termoBusca);
            });
        }

        // Começando com #, a busca é de publicações por hashtag
        searchForm.addEventListener("submit", (event) => {
            const termo = searchInput.value.trim();
            if (termo.startsWith("#")) {
                event.preventDefault();
                window.location.assign("/buscar-publicacoes?q=" + encodeURIComponent(termo));
            }
        });

        searchToggle.addEventListener("click", () => {
            setSearchOpen(!searchForm.classList.contains("is-open"));
        });

        document.addEventListener("click", (event) => {
            if (!searchForm.contains(event.target) && searchForm.classList.contains("is-open")) {
                setSearchOpen(false);
            }
        });

    </script>
{{end}}
