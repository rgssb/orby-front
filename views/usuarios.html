<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Usuários</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=20">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=3">
    <script src="/assets/js/tema.js?v=1"></script>
</head>

<body>
    {{template "cabecalho"}}

    <div class="content">
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Usuarios Encontrados</h5>
                        {{range .}}
                        <p class="card-text">{{.Nome}} - <a href="/perfil/{{.ID}}">@{{.Nick}}</a> - Membro Desde: {{.CriadoEm.Format "02/01/2006"}}</p>
                        {{else}}
                        <p class="card-text">Nenhum usuário encontrado...</p>
                        {{end}}
                    </div>
                </div>
            </div>
        </div>
    </div>

    {{template "rodape" .}}
    {{template "scripts" .}}
</body>


</html>
