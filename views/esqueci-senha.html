<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Recuperar senha</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="/assets/css/login.css?v=6">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=12">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=38">
    <script src="/assets/js/tema.js?v=3"></script>
</head>
<body>
    <main class="login-container">
        <div>
            <form class="Orby-form needs-validation" id="esqueci-senha" novalidate>
                {{template "mascote" "orby-mascot--empty"}}
                <h1 class="auth-title">Recuperar senha</h1>
                <p class="auth-text">Informe seu e-mail e enviaremos um link para criar uma nova senha.</p>
                <div class="form-group">
                    <label class="sr-only" for="email">E-mail</label>
                    <input class="form-control" type="email" name="email" id="email" placeholder="Digite o seu email" autocomplete="username" required>
                    <div class="invalid-feedback">Digite um e-mail válido.</div>
                </div>
                <div class="alert form-message" id="form-message" role="alert" aria-live="polite" hidden></div>
                <a href="/login">Voltar ao login</a>
                <button type="submit" class="btn btn-primary btn-Orby">Enviar link</button>
            </form>
        </div>
    </main>
    <script src="/assets/js/orby-mascot.js?v=3"></script>
    <script src="https://kit.fontawesome.com/db88157b12.js" crossorigin="anonymous"></script>
    <script src="/assets/js/recuperacao.js?v=1"></script>
</body>
</html>
