<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - #{{.Busca}}</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=23">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=12">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=32">
    <link rel="stylesheet" href="/assets/css/usuarios.css?v=25">
    <script src="/assets/js/tema.js?v=3"></script>
</head>

<body>
    {{template "cabecalho"}}

    <main id="conteudo-principal" tabindex="-1" class="container-fluid users-page">
        <section class="users-column" aria-labelledby="users-title">
            <header class="feed-header">
                <h1 id="users-title"><i class="fa-solid fa-hashtag" aria-hidden="true"></i> {{.Busca}}</h1>
                {{template "abas-busca" "publicacoes"}}
            </header>
            <nav class="feed-tabs" aria-label="Ordenar publicações">
                <div class="feed-tabs-group feed-tabs-order">
                    <a class="feed-tab{{if ne .Ordem "populares"}} is-active{{end}}" href="/hashtags/{{.Busca}}?ordem=recentes">Recentes</a>
                    <a class="feed-tab{{if eq .Ordem "populares"}} is-active{{end}}" href="/hashtags/{{.Busca}}?ordem=populares">Em alta</a>
                </div>
            </nav>
            {{if .Publicacoes}}
            <div id="feed-lista">{{template "feed-itens" .}}</div>
            {{else}}
            <div class="users-empty">
                <span class="composer-icon" aria-hidden="true"><i class="fa-solid fa-hashtag"></i></span>
                <h2>Nenhuma publicação com #{{.Busca}}</h2>
                <p>Seja a primeira pessoa a usar essa hashtag.</p>
            </div>
            {{end}}
        </section>
    </main>

    {{template "rodape"}}
    {{template "scripts" .}}
</body>

</html>
