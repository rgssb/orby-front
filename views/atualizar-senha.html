<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orby - Atualizar Senha</title>
    <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg?v=5">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png?v=5">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png?v=5">
    <link rel="shortcut icon" href="/assets/img/favicon.ico?v=5">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png?v=5">
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/img/icon-512.png?v=5">
    <link rel="stylesheet" href="/assets/css/bootstrap.css">
    <link rel="stylesheet" href="/assets/css/home.css?v=24">
    <link rel="stylesheet" href="/assets/css/mascote.css?v=4">
    <link rel="stylesheet" href="/assets/css/swal-orby.css">
    <link rel="stylesheet" href="/assets/css/themes.css?v=12">
    <link rel="stylesheet" href="/assets/css/refinamentos.css?v=38">
    <link rel="stylesheet" href="/assets/css/usuarios.css?v=25">
    <script src="/assets/js/tema.js?v=3"></script>
</head>
<body>
    {{template "cabecalho"}}

    <main id="conteudo-principal" tabindex="-1" class="container-fluid users-page edit-profile-page">
        <section class="users-column" aria-labelledby="update-password-title">
            <article class="composer-card edit-profile-card">
                <header class="composer-header">
                    <span class="composer-icon" aria-hidden="true"><i class="fa-solid fa-key"></i></span>
                    <div>
                        <h1 id="update-password-title">Atualização de senha</h1>
                        <p>Informe sua senha atual e escolha uma nova.</p>
                    </div>
                </header>
                <form class="edit-profile-form" id="atualizar-senha">
                    <div class="form-group">
                        <label for="senha-atual">Senha atual</label>
                        <input type="password" class="form-control" id="senha-atual" name="senha-atual" placeholder="Insira a sua senha atual" autocomplete="current-password" required>
                    </div>
                    <div class="form-group">
                        <label for="nova-senha">Nova senha</label>
                        <input type="password" class="form-control" id="nova-senha" name="nova-senha" placeholder="Insira a sua senha nova" autocomplete="new-password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmar-senha">Confirmar senha</label>
                        <input type="password" class="form-control" id="confirmar-senha" name="confirmar-senha" placeholder="Confirme a nova senha" autocomplete="new-password" required>
                    </div>
                    <div class="edit-profile-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-lock" aria-hidden="true"></i> Atualizar senha</button>
                    </div>
                </form>
            </article>
        </section>
    </main>

    {{template "rodape"}}
    {{template "scripts"}}
    <script src="/assets/js/usuario.js?v=5"></script>
</body>
</html>
